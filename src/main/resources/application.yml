spring:
  config:
    # IDEA 的工作目录选项目根目录，就会和启动脚本使用同一份本地连接配置。
    import: optional:file:./config/application-local.yml
  application:
    name: my-shop
  datasource:
    url: ${SHOP_DB_URL:jdbc:mysql://127.0.0.1:3306/my_shop_v2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&sslMode=PREFERRED}
    username: ${SHOP_DB_USER:shop_app_v2}
    password: ${SHOP_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never
server:
  address: 127.0.0.1
  port: ${SHOP_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: strict
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
springdoc:
  swagger-ui:
    path: /api-docs.html
shop:
  demo:
    seed: ${SHOP_DEMO_SEED:true}
logging:
  level:
    edu.shop: INFO
