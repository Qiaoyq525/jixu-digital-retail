spring:
  datasource:
    # 通过 SHOP_TEST_DB_* 可在隔离 MySQL 数据库上重跑同一组集成测试。
    url: ${SHOP_TEST_DB_URL:jdbc:h2:mem:shop_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
    username: ${SHOP_TEST_DB_USER:sa}
    password: ${SHOP_TEST_DB_PASSWORD:}
    driver-class-name: ${SHOP_TEST_DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
logging:
  level:
    edu.shop: WARN
    org.springframework: WARN
